{# Language selector: a globe opening the list of languages; each link sets the lang cookie and comes back here #}
<details class="lang-switcher {{ lang_switcher_class | default('') }}">
    <summary title="{{ t('lang.choose') }}" aria-label="{{ t('lang.choose') }}">
        <svg class="lang-globe" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        <span class="lang-current">{{ current_language() | upper }}</span>
    </summary>
    <div class="lang-menu">
        {% for code, name in language_names.items() %}
        <a href="{{ language_switch_url(request, code) }}" hreflang="{{ code }}" lang="{{ code }}"{% if code == current_language() %} class="active" aria-current="true"{% endif %}>{{ code | upper }} &middot; {{ name }}</a>
        {% endfor %}
    </div>
</details>
